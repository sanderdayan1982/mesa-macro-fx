# Publish the repo root as a static site. Frontend reads /data/<ccy>/*.json from GitHub Raw with 5-min sessionStorage + CDN cache.
[build]
  publish = "."
  command = ""
  # Deploy only when a dashboard page (or this file) changed. Data/bot commits are read by the pages
  # from raw.githubusercontent.com, so they do not need a deploy (15 credits each).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- '*index.html' netlify.toml"
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"
