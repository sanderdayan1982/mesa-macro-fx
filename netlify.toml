# Publish the repo root as a static site. Frontend reads /data/<ccy>/*.json from GitHub Raw with 5-min sessionStorage + CDN cache.
[build]
  publish = "."
  command = ""
  # Deploy only when HTML or this file changed. Data/bot commits are read from
  # raw.githubusercontent.com, so they do not need a deploy (credits saved).
  # Exit 0 = cancel, exit != 0 = build.
  # Cancel only when the diff can be compared and says, with certainty, "no changes".
  # If CACHED_COMMIT_REF is missing, equals COMMIT_REF (no usable cache), or is
  # not in the clone (shallow), or git diff itself fails: build (t333u).
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ -z \"$COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ] || ! git cat-file -e \"$CACHED_COMMIT_REF^{commit}\" 2>/dev/null || ! git cat-file -e \"$COMMIT_REF^{commit}\" 2>/dev/null; then exit 1; fi; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- '*.html' netlify.toml; test $? -eq 0"
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"
