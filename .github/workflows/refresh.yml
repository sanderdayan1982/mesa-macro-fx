# Mesa Macro FX — CAD refresh lanes (Desk Standard v0.3). Shown in Actions as "refresh-cad" (file kept as refresh.yml so run history and cron continue).
# One workflow, a currency matrix, one concurrency group per currency so commits never collide.
# Lanes (UTC): weekly Fri 19:00 (20:00 WAT) · daily Mon–Fri 21:30 (22:30 WAT) · monthly Mon 06:00 · manual dispatch.
name: refresh-cad
on:
  schedule:
    - cron: "0 19 * * 5"      # weekly lane — BoC B2 balance sheet (Wednesday data, published Friday)
    - cron: "30 21 * * 1-5"   # daily lane  — CORRA, yields, Receiver General cash balance
    - cron: "0 6 * * 1"       # monthly lane — chartered banks C1/C2 check
    - cron: "0 5 1 * *"       # keepalive + full revalidation (backfill) on the 1st
  workflow_dispatch:
    inputs:
      lane:
        description: "weekly | daily | monthly | all"
        default: "all"
      backfill:
        description: "full history refetch (true/false)"
        default: "false"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ccy: [cad]            # add gbp, chf, aud, nzd, jpy, eur, usd as their configs land
    concurrency:
      group: refresh-${{ matrix.ccy }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Resolve lane
        id: lane
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "lane=${{ github.event.inputs.lane }}" >> $GITHUB_OUTPUT
            echo "backfill=${{ github.event.inputs.backfill }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 19 * * 5")    echo "lane=weekly"  >> $GITHUB_OUTPUT; echo "backfill=false" >> $GITHUB_OUTPUT ;;
              "30 21 * * 1-5") echo "lane=daily"   >> $GITHUB_OUTPUT; echo "backfill=false" >> $GITHUB_OUTPUT ;;
              "0 6 * * 1")     echo "lane=monthly" >> $GITHUB_OUTPUT; echo "backfill=false" >> $GITHUB_OUTPUT ;;
              *)               echo "lane=all"     >> $GITHUB_OUTPUT; echo "backfill=true"  >> $GITHUB_OUTPUT ;;
            esac
          fi
      - name: Run ingestion
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.lane.outputs.backfill }}" = "true" ]; then BF="--backfill"; else BF=""; fi
          python -m ingest.run --ccy ${{ matrix.ccy }} --lane ${{ steps.lane.outputs.lane }} $BF || echo "::warning::ingestion finished with source errors (see logs/${{ matrix.ccy }}/oplog.json)"
      - name: Validate JSON against schema
        run: python -m ingest.validate --ccy ${{ matrix.ccy }}
      - name: v0.4 reconciliation checks (operations vs B2, signs, calendars)
        run: python -m ingest.tests_v04 || echo "::warning::v0.4 self-checks failed (see step log)"
      - name: Anti-invention gate (daily_log)
        run: python -m ingest.gate --ccy ${{ matrix.ccy }} || echo "::warning::daily_log withheld by the anti-invention gate (see data/${{ matrix.ccy }}/agent.json)"
      - name: Commit data
        run: |
          git config user.name "mesa-macro-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/${{ matrix.ccy }} history/${{ matrix.ccy }} logs/${{ matrix.ccy }} data/mesa history/mesa
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data(${{ matrix.ccy }}): ${{ steps.lane.outputs.lane }} refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # eight workflows push to main concurrently and all write data/mesa/*: a plain pull --rebase leaves a conflict behind and
          # the push fails ("Commit data: failure", NZD #15 2026-09-11). Rebase favouring this run's files (-X theirs = the commit
          # being replayed = ours), abort cleanly on anything else, retry the push up to 4 times.
          MSG="$(git log -1 --pretty=%s)"; OURS="$(git rev-parse HEAD)"
          for i in 1 2 3 4; do
            if ! git pull --rebase -X theirs origin ${{ github.ref_name }}; then
              # rebase could not complete: rebuild this run's commit on top of the remote, touching only this run's own paths
              git rebase --abort 2>/dev/null || true
              git fetch origin ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
              git checkout "$OURS" -- data/${{ matrix.ccy }} history/${{ matrix.ccy }} logs/${{ matrix.ccy }} data/mesa history/mesa
              git commit -m "$MSG" || true
            fi
            if git push; then exit 0; fi
            sleep $((10 * i))
          done
          echo "::error::push failed after 4 attempts"; exit 1
