<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#090d13"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>GBP COMMAND CENTER — Liquidity</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#090d13;--bg2:#0e1319;--panel:#111820;--panel2:#151d28;--border:#1a2536;--border2:#243447;
--text:#c5d0dc;--text2:#8899aa;--text3:#556677;--white:#e8edf2;--blue:#33b1ff;--green:#42be65;--red:#fa4d56;--amber:#f1c21b;
--cyan:#08bdba;--purple:#be95ff;--gold:#f1c21b;--font:'JetBrains Mono',monospace;--sans:'IBM Plex Sans Condensed',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.4;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;gap:8px;flex-wrap:wrap}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-logo{font-family:var(--font);font-weight:800;font-size:13px;letter-spacing:.15em;color:var(--gold);background:#1a1608;border:1px solid #3d3010;padding:5px 10px}
.hdr-title{font-family:var(--font);font-weight:700;font-size:16px;color:var(--white);letter-spacing:.04em}
.hdr-sub{font-size:13px;color:var(--text2);margin-left:8px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--font);font-size:12px;font-weight:700;padding:4px 10px;border:1px solid var(--border);color:var(--text2);letter-spacing:.04em}
.pill.ok{border-color:#1a3a2a;color:var(--green)}.pill.warn{border-color:#3a2a0a;color:var(--amber)}.pill.err{border-color:#3a1a1a;color:var(--red)}
.regime{font-family:var(--font);font-size:13px;font-weight:800;padding:5px 14px;letter-spacing:.1em;text-transform:uppercase;border:1px solid}
.regime.GREEN{background:#0a2a1a;color:var(--green);border-color:#1a4a2a}.regime.YELLOW{background:#1a1a0a;color:var(--amber);border-color:#3a3a1a}
.regime.RED{background:#2a0a0a;color:var(--red);border-color:#4a1a1a}.regime.NONE{background:#1a1a1a;color:#777;border-color:#2a2a2a}
.btn{font-family:var(--font);font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);letter-spacing:.04em}
.btn:hover{border-color:var(--blue);color:var(--blue)}
/* tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);overflow-x:auto;padding:0 16px}
.tab{font-family:var(--font);font-size:13px;font-weight:600;padding:10px 14px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;letter-spacing:.03em;white-space:nowrap}
.tab:hover{color:var(--white)}.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
/* wire + msg */
.wire{background:#0a0d11;border-bottom:1px solid var(--border);padding:6px 16px;overflow:hidden;white-space:nowrap;font-family:var(--font);font-size:12px;color:var(--text2);text-overflow:ellipsis}
.wire b{color:var(--amber);margin-right:8px}.wire a{color:var(--text2);text-decoration:none;margin-right:28px}.wire a:hover{color:var(--blue)}
.msg{padding:7px 16px;font-family:var(--font);font-size:13px;font-weight:600;border-bottom:1px solid var(--border)}
.msg.ok{background:#071a0e;color:var(--green)}.msg.alert{background:#1a0808;color:var(--red)}.msg.info{background:#08121a;color:var(--blue)}.msg.warn{background:#1a1508;color:var(--amber)}
/* layout */
.main{padding:12px}
.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}
.g2{grid-column:span 2}.g3{grid-column:span 3}.g4{grid-column:span 4}.g5{grid-column:span 5}.g6{grid-column:span 6}.g7{grid-column:span 7}.g8{grid-column:span 8}.g9{grid-column:span 9}.g12{grid-column:span 12}
.layer{margin:18px 0 8px;display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--border2);padding-bottom:6px}
.layer h2{font-family:var(--font);font-size:15px;font-weight:800;letter-spacing:.12em;color:var(--white);text-transform:uppercase}
.layer .num{font-family:var(--font);font-size:20px;font-weight:800;color:var(--gold)}
.layer .sub{font-size:13px;color:var(--text2)}
.layer .lsig{margin-left:auto}
.card{background:var(--panel);border:1px solid var(--border);padding:12px;min-height:80px}
.card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:6px}
.card-title{font-family:var(--font);font-size:13px;font-weight:700;color:var(--white);letter-spacing:.04em;text-transform:uppercase}
.card-sub{font-size:12px;color:var(--text2);margin-top:2px}
.card-src{font-size:11px;color:var(--text3);margin-top:6px;font-family:var(--font)}
.kpi{font-family:var(--font);font-size:24px;font-weight:800;color:var(--white);line-height:1;margin:4px 0}.kpi.sm{font-size:19px}
.delta{font-family:var(--font);font-size:13px;font-weight:700}.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.flat{color:var(--text2)}
.badge{font-family:var(--font);font-size:11px;font-weight:800;padding:2px 7px;letter-spacing:.08em;text-transform:uppercase;display:inline-block;border:1px solid;white-space:nowrap}
.badge.fresh{background:#0a2a1a;color:var(--green);border-color:#1a3a2a}.badge.stale{background:#1a1a0a;color:var(--amber);border-color:#2a2a0a}
.badge.proxy{background:#0a1a2a;color:var(--blue);border-color:#1a2a3a}.badge.degraded{background:#2a1a0a;color:#f97316;border-color:#3a2a1a}
.badge.unavailable{background:#1a1a1a;color:#777;border-color:#2a2a2a}
.badge.SAFE{background:#0a2a1a;color:var(--green);border-color:#1a3a2a}.badge.WATCH{background:#1a1a0a;color:var(--amber);border-color:#2a2a0a}
.badge.STRESS{background:#2a0a0a;color:var(--red);border-color:#3a1a1a}.badge.CRISIS{background:#3a0a0a;color:#fff;border-color:var(--red)}
.badge.NODATA{background:#1a1a1a;color:#777;border-color:#2a2a2a}.badge.blue{background:#0a1a2a;color:var(--blue);border-color:#1a2a3a}
.badge.BAND_HIGH{background:#0a2a1a;color:var(--green);border-color:#1a3a2a}.badge.BAND_LOW{background:#2a0a0a;color:var(--red);border-color:#3a1a1a}.badge.NEUTRAL{background:#1a1a0a;color:var(--amber);border-color:#2a2a0a}
.chart{margin-top:6px}.chart svg{display:block;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--font)}
th{text-align:left;padding:6px 8px;color:var(--text2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
td{padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top}
td.num,th.num{text-align:right}td.pos{color:var(--green)}td.neg{color:var(--red)}
.hm td{text-align:center;min-width:18px;padding:3px 4px;font-size:11px}.hm-GREEN{background:#0d2818;color:var(--green)}.hm-YELLOW{background:#1a1a08;color:var(--amber)}.hm-RED{background:#1a0808;color:var(--red)}.hm-NONE{color:#555}
.alert-item{padding:8px 12px;border-left:3px solid var(--border);margin-bottom:4px;background:var(--bg2);font-size:13px;display:flex;gap:12px;align-items:flex-start;font-family:var(--font)}
.alert-item.CRITICAL{border-left-color:var(--red)}.alert-item.WARNING{border-left-color:var(--amber)}.alert-item.INFO{border-left-color:var(--blue)}
.alert-ts{font-size:12px;color:var(--text2);min-width:150px}.alert-sev{font-size:11px;font-weight:800;min-width:70px}
.scn{display:flex;gap:8px;flex-wrap:wrap}.scn-chip{font-family:var(--font);font-size:12px;padding:6px 12px;border:1px solid var(--border)}
.scn-chip.on{border-color:var(--amber);color:var(--amber);background:#1a1508}.scn-chip.off{color:var(--text3)}
.note{background:rgba(6,182,212,.04);border:1px solid rgba(6,182,212,.15);padding:10px;font-size:13px;line-height:1.6;color:var(--text2);font-family:var(--font)}
.note b{color:var(--cyan)}
.cal-item{padding:8px 12px;border:1px solid var(--border);background:var(--bg2);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.cal-date{font-family:var(--font);font-weight:700;color:var(--white);min-width:100px}.cal-imp{font-family:var(--font);font-size:12px;font-weight:800}.cal-imp.HIGH{color:var(--red)}.cal-imp.MEDIUM{color:var(--amber)}.cal-imp.LOW{color:var(--text3)}
.take{font-family:var(--font);font-size:14px;line-height:1.7;color:var(--white)}
.mono{font-family:var(--font)}
.ops{font-family:var(--font);font-size:12px;padding:4px 10px;border-bottom:1px solid var(--border);display:flex;gap:12px;color:var(--text2)}
/* desk navigation (home + eight currencies) */
.desknav{display:flex;align-items:center;gap:4px;padding:6px 16px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.desknav a{font-family:var(--font);font-size:13px;font-weight:700;padding:6px 10px;border:1px solid var(--border);color:var(--text2);text-decoration:none;letter-spacing:.06em;white-space:nowrap;min-height:32px;display:inline-flex;align-items:center}
.desknav a:hover{border-color:var(--blue);color:var(--blue)}.desknav a.cur{color:var(--gold);border-color:#3d3010;background:#1a1608}
.desknav a.home{color:var(--white);background:var(--panel2);border-color:var(--border2);margin-right:6px}
.desknav .sep{width:1px;height:20px;background:var(--border2);margin:0 4px;flex:none}
/* responsive — phones and tablets */
.card{overflow-x:auto}.card table{min-width:100%}
@media(max-width:1100px){.g2,.g3,.g4,.g5,.g6,.g7,.g8{grid-column:span 12}.kpi{font-size:20px}}
@media(max-width:900px){.hdr-sub{display:none}.main{padding:8px}.grid{gap:6px}.tab{padding:12px 12px}.btn,.pill,.regime{min-height:32px;display:inline-flex;align-items:center}}
@media(max-width:700px){.g2,.g3{grid-column:span 6}.g5,.g7,.g9{grid-column:span 12}body{font-size:16px}.hdr{padding:8px 10px}.hdr-title{font-size:15px}.tabs,.desknav,.wire,.msg,.ops{padding-left:10px;padding-right:10px}
 .card{padding:10px;min-height:0}.kpi{font-size:22px}.kpi.sm{font-size:17px}.take{font-size:15px;line-height:1.75}.note{font-size:14px}
 .alert-item{flex-wrap:wrap;gap:6px}.alert-ts{min-width:0}.cal-item{flex-wrap:wrap}.cal-date{min-width:0}
 .layer{flex-wrap:wrap;gap:6px}.layer .lsig{margin-left:0;width:100%}.hdr-right{width:100%;justify-content:flex-start}}
@media(max-width:480px){.g2,.g3{grid-column:span 12}.hdr-right .pill:nth-child(n+4){display:none}.wire{display:none}}
/* blotter de ocho segundos (lote blotter, 2026-09-12): una fila canónica por divisa antes de las capas */
.blotter{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.blotter .bc{background:var(--panel2);border:1px solid var(--border);padding:8px 10px;min-width:0}.blotter .bt{font-family:var(--font);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.blotter .bv{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.blotter .bs{font-family:var(--font);font-size:12px;color:var(--text2);margin-top:4px;overflow-wrap:anywhere}
.blotter .lag{font-family:var(--font);font-size:11px;font-weight:800;padding:2px 7px;letter-spacing:.06em;border:1px solid;display:inline-block}.blotter .lag.amber{color:var(--amber);border-color:var(--amber)}.blotter .lag.red{color:var(--red);border-color:var(--red)}
@media(max-width:900px){.blotter{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.blotter{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left"><div class="hdr-logo">GBP</div><div><span class="hdr-title">GBP COMMAND CENTER</span><span class="hdr-sub">Sterling Monetary Framework · HM Treasury / ONS · Money & Credit · SONIA — MMT/Mosler desk</span></div></div>
  <div class="hdr-right">
    <div id="regimePill" class="regime NONE" title="Señal: régimen general del motor (acuerdo BC/Tesoro con puertas de precio). No es calidad de datos ni confianza del modelo.">LOADING</div>

    <div id="confPill" class="pill" title="Calidad media de los datos (quality.system.average, 0–100): cobertura y frescura de las series. No es confianza del modelo ni probabilidad; la mesa no publica confianza numérica.">CALIDAD DATOS —</div>
    <div id="modelPill" class="pill" title="Confianza del modelo: de qué está hecha cada pata (motor v0.3/v0.4 y verdad contable / proxy / unilateral, de data/mesa/jefe.json.completeness). Marca, no probabilidad.">MODELO —</div>

</div>
<div class="desknav"><a class="home" href="../">⌂ MESA</a><span class="sep"></span><a href="../usd/">USD</a><a href="../eur/">EUR</a><a href="../gbp/" class="cur">GBP</a><a href="../jpy/">JPY</a><a href="../chf/">CHF</a><a href="../cad/">CAD</a><a href="../aud/">AUD</a><a href="../nzd/">NZD</a><span class="sep"></span><a href="../mesa/">ESTADO</a></div>
<div class="tabs" id="tabBar">
  <div class="tab active" data-tab="command">COMMAND</div>
  <div class="tab" data-tab="regime">REGIME</div>

  <div class="tab" data-tab="calendar">CALENDAR</div>

</div>
<div id="msg" class="msg info">Loading data/gbp/*.json…</div>

<div class="main">
  <section class="section active" id="sec-command">
    <div class="grid" id="execHeader"></div>
    <div id="layers"></div>
  </section>
  <section class="section" id="sec-regime"><div class="grid" id="regimeGrid"></div></section>
  <section class="section" id="sec-alerts"><div class="grid" id="alertsGrid"></div></section>
  <section class="section" id="sec-agent"><div class="grid" id="agentGrid"></div></section>
  <section class="section" id="sec-calendar"><div class="grid" id="calGrid"></div></section>
  <section class="section" id="sec-history"><div class="grid" id="histGrid"></div></section>
  <section class="section" id="sec-system"><div class="grid" id="sysGrid"></div></section>
</div>
<script>
// ═══════════════════════════════════════════════════════════════════════
// GBP COMMAND CENTER — frontend engine (reads static JSON only; no source fetches)
// Layer order is fixed by the desk rule: 1 central bank → 2 treasury/equivalent → 3 banking transmission → 4 rates
// ═══════════════════════════════════════════════════════════════════════
const CCY='gbp';
// v0.4 hosting: the JSON is read straight from GitHub (branch main) so data commits never trigger a Netlify deploy;
// the site itself deploys from branch `site` only when the HTML changes. Fallback: the relative path (same origin).
const DATA_ROOT='https://raw.githubusercontent.com/sanderdayan1982/mesa-macro-fx/main/', BASE=DATA_ROOT+'data/'+CCY+'/', BASE_LOCAL='../data/'+CCY+'/', VQ='?v='+Math.floor(Date.now()/60000);
function tfetch(u,ms){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); return fetch(u,{cache:'no-store',signal:c.signal}).finally(()=>clearTimeout(t)); }
function getJSON(f){ return fetch(BASE_LOCAL+f+'.json'+VQ,{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })  // relative first: every commit deploys (round 2)
  .catch(()=>tfetch(BASE+f+'.json'+VQ,6000).then(r=>r.ok?r.json():null).catch(()=>null)); }
const FILES=['central_bank','fiscal','banking','rates','regime','calendar','quality','alerts','revisions','regime_history','news','oplog','agent','regime_changelog'];
const $=id=>document.getElementById(id);
let D={};

document.querySelectorAll('#tabBar .tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('#tabBar .tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');$('sec-'+t.dataset.tab).classList.add('active');
}));

// ── formatters ──
const fB=v=>v==null?'—':'£'+(v/1000).toFixed(1)+'bn';
const fM=v=>v==null?'—':(v>=0?'+':'')+'£'+(v/1000).toFixed(1)+'bn';
const fK=v=>v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
const fP=v=>v==null?'—':(v>0?'+':'')+Number(v).toFixed(2)+'%';
const fBps=v=>v==null?'—':(v>0?'+':'')+Number(v).toFixed(1)+' bps';
const fR=v=>v==null?'—':Number(v).toFixed(2)+'%';
const fZ=v=>v==null?'—':(v>0?'+':'')+Number(v).toFixed(2)+'σ';
const fN=v=>v==null?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:2});
const fX=v=>v==null?'—':Number(v).toFixed(2);
const pct=v=>v==null?'—':'p'+Math.round(v);
const badge=(t,cls)=>`<span class="badge ${cls||t}">${t}</span>`;
const lvlBadge=l=>badge(l||'NO DATA',(l||'NODATA').replace(' ',''));
function delta(e,inv,fmt){ if(!e||e.prev_value==null||e.value==null) return '<span class="delta flat">—</span>'; const flow=!!fmt; const v=flow?e.change_abs:e.change_pct; if(v==null) return '<span class="delta flat">—</span>'; const up=inv?v<0:v>0, dn=inv?v>0:v<0; return `<span class="delta ${up?'up':dn?'down':'flat'}">${flow?(fmt(v)+' abs'):fP(v)} vs prev (${e.prev_date||''})</span>`; }
function e(block,key){ const b=D[block]; if(!b) return null; return (b.series&&b.series[key])||(b.derived&&b.derived[key])||(b.series_v04&&b.series_v04[key])||null; }
function shadowCard(block){ const c=D[block]&&D[block].signals&&D[block].signals.components_v04; if(!c) return ''; const f=Object.entries(c.flow||{}).map(([k,v])=>k+' '+(v>0?'+':'')+Number(v).toFixed(2)).join(' · '); const l=Object.entries(c.level||{}).map(([k,v])=>k+' '+Number(v).toFixed(2)).join(' · '); return textCard('v0.4 shadow components (not in the live regime until the replay sets the cuts)',`<div class="note"><b>flows</b> ${f||'—'}<br><b>levels</b> ${l||'—'}<br>${c.note||''}</div>`,'g12',badge('proxy')); }
function calCard(block,key,title,sub){ const x=e(block,key); if(!x) return ''; return textCard(title,`<div class="kpi sm">${fM(x.value)}</div><div class="card-src">${sub} · ${(x.calendar||[]).map(v=>v[0].slice(5)+' '+fM(v[1])).join(' · ')}</div>`,'g3',badge(x.status)); }

// ── SVG sparkline with threshold lines ──
function spark(vals,opts={}){
  const data=(vals||[]).map(Number).filter(Number.isFinite); if(data.length<2) return '<div style="color:var(--text3);font-size:12px;padding:6px 0">insufficient data</div>';
  const W=opts.w||600,H=opts.h||90,PX=4,PY=10; const th=(opts.thresholds||[]).filter(t=>Number.isFinite(t.value));
  let mn=Math.min(...data,...th.map(t=>t.value)),mx=Math.max(...data,...th.map(t=>t.value)); if(mn===mx){mn-=1;mx+=1}
  const r=mx-mn,lo=mn-r*.08,hi=mx+r*.08,fr=hi-lo;
  const x=i=>PX+i/(data.length-1)*(W-2*PX), y=v=>H-PY-((v-lo)/fr)*(H-2*PY);
  let s='';
  for(let i=0;i<3;i++){const gy=PY+i/2*(H-2*PY);s+=`<line x1="${PX}" y1="${gy}" x2="${W-PX}" y2="${gy}" stroke="rgba(255,255,255,.05)"/>`;}
  if(opts.zero&&lo<0&&hi>0) s+=`<line x1="${PX}" y1="${y(0)}" x2="${W-PX}" y2="${y(0)}" stroke="rgba(255,255,255,.25)" stroke-dasharray="3 3"/>`;
  th.forEach(t=>{s+=`<line x1="${PX}" y1="${y(t.value)}" x2="${W-PX}" y2="${y(t.value)}" stroke="${t.color}" stroke-dasharray="4 4"/><text x="${W-PX-2}" y="${y(t.value)-3}" text-anchor="end" fill="${t.color}" font-size="8" font-family="JetBrains Mono" font-weight="700">${t.label}</text>`;});

  $('calGrid').innerHTML=textCard('Upcoming releases & events (operator tz '+(C.timezone_operator||'')+' · '+(C.wat_offset_note||'')+')',C.upcoming.map(i=>`<div class="cal-item"><span class="cal-date">${i.date||'rolling'}</span><span style="flex:1">${i.title}</span><span class="mono" style="font-size:12px;color:var(--text2)">${i.time_local||''}</span><span class="cal-imp ${i.impact}">${i.impact}</span><span class="mono" style="font-size:12px;color:${i.days_until!=null&&i.days_until<=2?'var(--red)':'var(--text2)'}">${i.days_until!=null?(i.days_until===0?'today':i.days_until+'d'):''}</span></div>`).join(''),'g12');

  // ── HISTORY ──
  function histTable(block,cols,fmts,n){ const b=D[block]; if(!b||!b.history||!b.history.dates) return '—'; const h=b.history; const idx=h.dates.map((d,i)=>i).slice(-n).reverse(); return `<div style="overflow:auto;max-height:420px"><table><thead><tr><th>Date</th>${cols.map(c=>`<th class="num">${c}</th>`).join('')}</tr></thead><tbody>${idx.map(i=>`<tr><td>${h.dates[i]}</td>${cols.map((c,j)=>{const v=(h.rows[c]||[])[i];return `<td class="num ${c.includes('pct')||c.includes('flow')||c.includes('impact')?(v>0?'pos':v<0?'neg':''):''}">${fmts[j](v)}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`; }
  $('histGrid').innerHTML=textCard('Central bank — weekly (52w)',histTable('central_bank',['reserves','policy_balance_sheet','repo_offset','apf_loan','policy_balance_sheet_wow_pct','qt_pace'],[fB,fB,fB,fB,fP,fM],52),'g6')
    +textCard('Rates — daily (60d)',histTable('rates',['overnight_minus_policy_bps','overnight_minus_osf_bps','curve_10y_5y_bps','policy_minus_5y_bps','bond_10y'],[fBps,fBps,fBps,fBps,fR],60),'g6')
    +textCard('Fiscal — monthly (36m)',histTable('fiscal',['net_spending','net_spending_yoy','cg_expenditure','cg_receipts','cgncr','psnb_ex'],[fM,fM,fB,fB,fM,fM],36),'g6')
    +textCard('Banking — monthly (24m)',histTable('banking',['m4_lending_ex_change','pnfc_lending_change','lending_to_individuals_change','household_m4','mortgage_approvals'],[fM,fM,fM,fB,fK],24),'g6')
    +textCard('Signal log (central bank)',`<div style="max-height:300px;overflow:auto">${((cb&&cb.history.signal_log)||[]).slice().reverse().map(s=>`<div class="ops"><span>${s.date}</span><span style="color:var(--white)">${s.label}</span><span>${s.score}</span><span>${s.note||''}</span></div>`).join('')}</div>`,'g12');

  // ── SYSTEM ──
  const qs=Q.series||{}; const RV=(D.revisions&&D.revisions.revisions)||[]; const OP=(D.oplog&&D.oplog.entries)||[];
  $('sysGrid').innerHTML=textCard(`Data quality — system confidence ${conf==null?'—':conf}/100`,`<div class="card-src" style="margin-bottom:6px">above 90: ${(Q.system||{}).abv90} · below 70: ${(Q.system||{}).blw70} · lowest: ${(Q.system||{}).lowest?(Q.system.lowest.series+' ('+Q.system.lowest.score+')'):'—'} · errors: ${(Q.errors||[]).join(', ')||'none'}</div><div style="max-height:380px;overflow:auto"><table><thead><tr><th>Series</th><th>Freshness</th><th>Last date</th><th class="num">Age (d)</th><th class="num">Confidence</th><th>Outlier</th></tr></thead><tbody>${Object.entries(qs).map(([k,v])=>`<tr><td>${k}</td><td>${badge(v.freshness)}</td><td>${v.last_valid_date||'—'}</td><td class="num">${v.age_days==null?'—':v.age_days}</td><td class="num">${v.confidence.score} <span class="badge ${v.confidence.tier==='HIGH'?'SAFE':v.confidence.tier==='MEDIUM'?'WATCH':'STRESS'}">${v.confidence.tier}</span></td><td>${v.latest_outlier?'⚠ MAD':''}</td></tr>`).join('')}</tbody></table></div>`,'g7')
    +textCard('Source health per block',`<table><thead><tr><th>Block</th><th>Status</th><th class="num">Loaded</th><th>Equivalence</th><th>as of</th><th>generated</th></tr></thead><tbody>${['central_bank','fiscal','banking','rates'].map(b=>{const x=D[b];if(!x)return `<tr><td>${b}</td><td>${badge('unavailable')}</td><td colspan=4>file missing</td></tr>`;return `<tr><td>${b}</td><td>${badge(x.source_health.status)}</td><td class="num">${x.source_health.series_loaded}/${x.source_health.series_expected}</td><td>${x.equivalence_quality||'—'}</td><td>${x.as_of||'—'}</td><td class="mono" style="font-size:11px">${(x.generated_at||'').slice(0,16)}</td></tr>`;}).join('')}</tbody></table>
      <div class="note" style="margin-top:10px"><b>Status taxonomy</b> fresh ≤1.5× period · stale ≤3× · proxy = documented equivalent · degraded = gaps/erratic · unavailable = shown as —, never hidden.<br><b>Config</b> ${R.config_version||''} · schema ${cb?cb.schema_version:''} · lane ${(R.heartbeat||{}).lane||''}${(R.heartbeat||{}).backfill?' (backfill)':''}</div>`,'g5')
    +textCard('Revisions detected (source restated a published value)',RV.length?`<table><thead><tr><th>Detected</th><th>Series</th><th>Date</th><th class="num">Old</th><th class="num">New</th><th class="num">Δ</th><th class="num">Δ%</th></tr></thead><tbody>${RV.map(r=>`<tr><td>${(r.detected_at||'').slice(0,10)}</td><td>${r.series}</td><td>${r.date}</td><td class="num">${fN(r.old_value)}</td><td class="num">${fN(r.new_value)}</td><td class="num">${fN(r.delta)}</td><td class="num">${fN(r.delta_pct)}%</td></tr>`).join('')}</tbody></table>`:'<div style="color:var(--text3);font-size:13px">no revisions detected</div>','g6')
    +textCard('Operator log',`<div style="max-height:320px;overflow:auto">${OP.slice(0,60).map(o=>`<div class="ops"><span>${(o.timestamp||'').replace('T',' ').slice(0,16)}</span><span style="color:var(--gold)">${o.type}</span><span style="color:var(--white)">${o.category}</span><span>${JSON.stringify(o.details||{}).slice(0,140)}</span></div>`).join('')||'<div style="color:var(--text3);font-size:13px">—</div>'}</div>`,'g6')
    +textCard('Methodology',`<div class="note"><b>Policy balance sheet</b> = STR (RPWB67A) + long-term ops (RPWB69A = ILTR + CTRF) + TFSME (RPWZOQ4) + loan to APF (RPWZ4TM) + sterling bonds (RPWZ4TL). It is NOT "Net Liquidity": the Weekly Report has no HMG deposits line, so the USD WALCL − TGA − RRP construct is not buildable weekly. Currency (notes RPWB55A) is outside money: shown as autonomous drain, not subtracted.<br><b>Reserves</b> = RPWB56A. Primary threshold = PMRR £365–515bn (BoE Bank Insights, 27 Mar 2026); inside the range = transition zone, never stress by itself; no rolling percentile on the level (non-stationary under QT).<br><b>Stress spread</b> = SONIA (IUDSOIA) − Bank Rate (IUDBEDR). Floor system: all reserves remunerated at Bank Rate, SONIA normally −3/−5 bps. ≥ −1 = early flag; ≥ +3 for 3 sessions = STRESS; ≥ +10 = CRISIS; OSF ceiling = Bank Rate + 25. Quantity of repo never escalates alone: REPO_DEPENDENCE_STRESS needs price confirmation.<br><b>Fiscal</b> = ONS PSF: net spending = CG expenditure (MF6U) − receipts (ANBV) is the NFA flow; CGNCR (RUUW) is the cash requirement (issuance drain), Z over 24 months; monthly with a 3-week lag, contribution capped ±0.5.<br><b>Banking</b> = Money & Credit flows (RPMB58Q M4Lex, LPMVWNQ PNFC, LPMBZ2C individuals, LPMVVHR household M4, LPMVTVX approvals): z-scores of flows; confirmation layer.<br><b>Regime</b> weights CB 0.45 · rates 0.35 · fiscal 0.10 · banking 0.10 (approved 2026-09-08, to be recalibrated with live history); LIQUIDITY_SCARCITY = reserves below PMRR floor AND spread ≥ STRESS; FLOOR_FRICTION = reserves ample AND SONIA ≥ Bank Rate for 3 sessions. Flags: QT_ACCELERATION, REPO_DEPENDENCE_HEALTHY/STRESS, CTRF_ACTIVE, FISCAL_BIG_MONTH, PHASE_QT.<br><b>Ingestion</b> BoE IADB CSV in batched sequential requests (verified batch, ≥ 2.5 s apart, never parallel; HTML answer = degraded, last good JSON kept as stale); ONS JSON API; GitHub Actions → JSON in git → Netlify static.</div>`,'g12');
  // WAT clock
  const wat=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Malabo',hour:'2-digit',minute:'2-digit'}); const ldn=new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'});
  const _ldn=new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'}),_ny=new Date().toLocaleTimeString('en-GB',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit'}); $('wat').textContent='LDN '+_ldn+' · NY '+_ny+' · WAT '+wat;
}

function exportJSON(){ const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='GBP_CC_audit_'+new Date().toISOString().slice(0,10)+'.json'; a.click(); }

async function loadAll(){
  $('msg').className='msg info'; $('msg').textContent='Loading…';
  const results=await Promise.allSettled(FILES.map(f=>getJSON(f)));
  D={}; results.forEach((r,i)=>{ D[FILES[i]]=r.status==='fulfilled'?r.value:null; });
  D.mesa_jefe=await fetch('../data/mesa/jefe.json'+VQ,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)||await tfetch(DATA_ROOT+'data/mesa/jefe.json'+VQ,6000).then(r=>r.ok?r.json():null).catch(()=>null); // verdad única del jefe (sello)
  if(!D.regime&&!D.central_bank){ $('msg').className='msg alert'; $('msg').textContent='No data files found under '+BASE+' — run the ingestion workflow first.'; return; }
  try{ render(); }catch(err){ $('msg').className='msg alert'; $('msg').textContent='Render error: '+err.message; console.error(err); }
}
loadAll(); setInterval(loadAll,15*60*1000);
</script>
